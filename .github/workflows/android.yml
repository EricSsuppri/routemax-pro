name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Vite Web Build
        run: npm run build

      - name: Setup Capacitor Native Mobile Layers
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Clean APK File
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK Package
        uses: actions/upload-artifact@v4
        with:
          name: RouteMaxPro-NoWatermark
          path: android/app/build/outputs/apk/debug/app-debug.apk
