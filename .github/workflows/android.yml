name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Vite Web Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Capacitor Native Mobile Layers
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Add OAuth deep link to AndroidManifest
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          filt = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.routemax.pro" android:host="oauth" />
              </intent-filter>'''
          if 'android:scheme="com.routemax.pro"' not in s:
              m = re.search(r'(<activity[^>]*\.MainActivity[^>]*>)(.*?)(</activity>)', s, re.S)
              assert m, 'MainActivity block not found in AndroidManifest.xml'
              s = s[:m.start(3)] + filt + '\n            ' + s[m.start(3):]
              open(p, 'w').write(s)
              print('deep link intent-filter added')
          else:
              print('deep link already present')
          EOF

      - name: Install custom app icons
        run: |
          pip install --break-system-packages pillow -q
          python3 - <<'EOF'
          from PIL import Image, ImageOps
          import os, re
          src = 'assets/icon.png'
          assert os.path.exists(src), 'assets/icon.png not found in repo'
          img = Image.open(src).convert('RGBA')
          res = 'android/app/src/main/res'
          for name, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              d = os.path.join(res, 'mipmap-' + name)
              os.makedirs(d, exist_ok=True)
              square = ImageOps.fit(img, (size, size), Image.LANCZOS)
              for fname in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  square.save(os.path.join(d, fname))
          # adaptive-icon background: match the icon green
          colors = os.path.join(res, 'values', 'colors.xml')
          s = open(colors).read()
          s2 = re.sub(r'(<color name="ic_launcher_background">)[^<]*', r'\1#0EA968', s)
          open(colors, 'w').write(s2)
          print('custom icons installed')
          EOF

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Clean APK File
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK Package
        uses: actions/upload-artifact@v4
        with:
          name: RouteMaxPro-NoWatermark
          path: android/app/build/outputs/apk/debug/app-debug.apk
